        }
      }
      function clearShareError() {
        const bar = document.getElementById('shareFormError');
        if (bar) { bar.textContent = ''; bar.classList.remove('is-visible'); }
        document.querySelectorAll('#shareForm [aria-describedby="shareFormError"]').forEach(field => {
          field.removeAttribute('aria-describedby');
          field.removeAttribute('aria-invalid');
        });
      }

      /* ============================================================
         MOBILE PANEL
         ============================================================ */
      function openMobilePanel() {
        mobilePanelReturnFocus = document.activeElement;
        const panel = document.getElementById('mobilePanel');
        if (!panel) return;
        panel.classList.add('is-open');
        panel.setAttribute('aria-hidden', 'false');
        document.querySelectorAll('#app > *:not(#mobilePanel)').forEach(el => {
          el.inert = true;
          el.setAttribute('aria-hidden', 'true');
        });
        document.body.classList.add('panel-open');
        const first = panel.querySelector('button,input,a[href]');
        if (first) setTimeout(() => first.focus(), 50);
      }
      function closeMobilePanel(restoreFocus) {
        const panel = document.getElementById('mobilePanel');
        if (!panel) return;
        panel.classList.remove('is-open');
        panel.setAttribute('aria-hidden', 'true');
        document.querySelectorAll('#app > *:not(#mobilePanel)').forEach(el => {
          el.inert = false;
          el.removeAttribute('aria-hidden');
        });
        document.body.classList.remove('panel-open');
        if (restoreFocus !== false && mobilePanelReturnFocus && typeof mobilePanelReturnFocus.focus === 'function') {
          mobilePanelReturnFocus.focus();
        }
        mobilePanelReturnFocus = null;
      }
      function mobilePanelFocusTrap(e) {
        const panel = document.getElementById('mobilePanel');
        if (!panel || !panel.classList.contains('is-open')) return;
        const focusables = Array.from(panel.querySelectorAll('a[href],button:not([disabled]),input'));
        if (!focusables.length) return;
        const first = focusables[0], last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }

      /* ============================================================
         ROUTER
         ============================================================ */
      const PAGE_TITLES = {
        '': 'Hope for All — Every story has a way forward.',
        'stories': 'Stories — Hope for All',
        'share': 'Share Your Story — Hope for All',
        'about': 'About — Hope for All',
        'guidelines': 'Community Guidelines — Hope for All',
        'safety': 'Safety — Hope for All',
        'privacy': 'Privacy — Hope for All',
        'contact': 'Contact — Hope for All',
        'admin': 'Moderator Preview — Hope for All (demo only)'
      };
      function currentPath() {
        const raw = location.hash.replace(/^#\/?/, '');
        return raw.split('?')[0];
      }

      function render() {
        const path = currentPath();
        const app = document.getElementById('app');
        let html = '';

        // Route guards for confirmation pages (prevent direct navigation)
        if (path === 'share/thank-you' && ssGet('hfa_submitted') !== '1') {
          location.hash = '#/share'; return;
        }
        if (path === 'contact/sent' && ssGet('hfa_contacted') !== '1') {
          location.hash = '#/contact'; return;
        }

        // Stop and sync reading progress
        readingProgressActive = false;
        const prog = document.getElementById('readingProgress');
        if (prog) { prog.style.width = '0%'; prog.classList.remove('is-visible'); }

        if (path === '') {
          html = renderHeader('') + renderHome() + renderFooter();
          document.title = PAGE_TITLES[''];
        } else if (path === 'stories') {
          readStoriesFilterFromURL();
          html = renderHeader('stories') + renderStoriesPage() + renderFooter();
          document.title = PAGE_TITLES['stories'];
        } else if (path.startsWith('stories/')) {
          const slug = path.slice(8);
          const story = findStory(slug);
          html = renderHeader('stories') + renderStoryDetail(slug) + renderFooter();
          document.title = story ? story.title + ' — Hope for All' : 'Story not found — Hope for All';
        } else if (path === 'share') {
          html = renderHeader('share') + renderShare() + renderFooter();
          document.title = PAGE_TITLES['share'];
        } else if (path === 'share/thank-you') {
          html = renderHeader('share') + renderShareConfirm() + renderFooter();
          document.title = PAGE_TITLES['share'];
        } else if (path === 'about') {
          html = renderHeader('about') + renderAbout() + renderFooter();
          document.title = PAGE_TITLES['about'];
        } else if (path === 'guidelines') {
          html = renderHeader('') + renderGuidelines() + renderFooter();
          document.title = PAGE_TITLES['guidelines'];
        } else if (path === 'safety') {
          html = renderHeader('') + renderSafety() + renderFooter();
          document.title = PAGE_TITLES['safety'];
        } else if (path === 'privacy') {
          html = renderHeader('') + renderPrivacy() + renderFooter();
          document.title = PAGE_TITLES['privacy'];
        } else if (path === 'contact') {
          html = renderHeader('') + renderContact(false) + renderFooter();
          document.title = PAGE_TITLES['contact'];
        } else if (path === 'contact/sent') {
          html = renderHeader('') + renderContact(true) + renderFooter();
          document.title = PAGE_TITLES['contact'];
        } else if (path === 'admin') {
          html = renderHeader('') + renderAdmin() + renderFooter();
          document.title = PAGE_TITLES['admin'];
        } else {
          html = renderHeader('') + renderNotFound() + renderFooter();
          document.title = 'Page not found — Hope for All';
        }

        app.innerHTML = html;
        const main = document.getElementById('main');
        if (main) main.setAttribute('tabindex', '-1');
        window.scrollTo(0, 0);
        closeMobilePanel(false);
        updateThemeButtons();

        if (!REDUCE_MOTION) {
          requestAnimationFrame(() => document.body.classList.add('motion-ready'));
        }

        // Init reading progress for story pages
        if (path.startsWith('stories/')) {
          setTimeout(initReadingProgress, 100);
        }

        // Update nav active state
        const topPath = path.split('/')[0];
        document.querySelectorAll('.nav-link').forEach(a => {
          const linkPath = a.getAttribute('href').replace(/^#\/?/, '');
          a.classList.toggle('is-active',
            linkPath === topPath || (linkPath === 'stories' && topPath === 'stories')
          );
        });
      }

      /* ============================================================
         EVENT DELEGATION
         ============================================================ */

      /* Click */
      document.addEventListener('click', function (e) {
        const t = e.target.closest('[data-action]');
        if (!t) {
          if (e.target.closest('.skip-link')) {
            e.preventDefault();
            const main = document.getElementById('main');
            if (main) main.focus();
            return;
          }
          // Close modal on backdrop click
          if (e.target.id === 'modalRoot') { closeModal(); return; }
          return;
        }
        const action = t.getAttribute('data-action');

        switch (action) {
          case 'toggle-nav-search': {
            const sf = document.querySelector('.nav-search');
            if (sf) {
              sf.classList.toggle('is-open');
              if (sf.classList.contains('is-open')) sf.querySelector('input').focus();
            }
            break;
          }
          case 'open-mobile-panel': openMobilePanel(); break;
          case 'close-mobile-panel': closeMobilePanel(true); break;
          case 'open-profile': openProfileModal(); break;
          case 'toggle-theme': toggleTheme(); break;
          case 'close-modal': closeModal(); break;

          case 'toggle-appreciate': {
            const slug = t.getAttribute('data-slug');
            const story = findStory(slug);
            if (!story) break;
            const wasAppreciated = appreciatedSet.has(slug);
            if (wasAppreciated) appreciatedSet.delete(slug); else appreciatedSet.add(slug);
            if (!saveAppreciated()) {
              if (wasAppreciated) appreciatedSet.add(slug); else appreciatedSet.delete(slug);
              const btn = document.getElementById('appreciateBtn');
              if (btn) btn.setAttribute('aria-label', 'Could not save appreciation. Please try again.');
              break;
            }
            const btn = document.getElementById('appreciateBtn');
            const isNow = appreciatedSet.has(slug);
            if (btn) {
              btn.classList.toggle('is-active', isNow);
              const svg = btn.querySelector('svg');
              if (svg) svg.setAttribute('fill', isNow ? 'currentColor' : 'none');
              if (!REDUCE_MOTION) { btn.classList.remove('just-clicked'); void btn.offsetWidth; btn.classList.add('just-clicked'); }
            }
            const countEl = document.getElementById('apprCount');
            if (countEl) countEl.textContent = apprCount(story);
            break;
          }

          case 'toggle-bookmark': {
            const slug = t.getAttribute('data-slug');
            if (!findStory(slug)) break;
            const wasSaved = bookmarkedSet.has(slug);
            if (wasSaved) bookmarkedSet.delete(slug); else bookmarkedSet.add(slug);
            if (!saveBookmarked()) {
              if (wasSaved) bookmarkedSet.add(slug); else bookmarkedSet.delete(slug);
              break;
            }
            const isSaved = bookmarkedSet.has(slug);
            document.querySelectorAll(`[data-action="toggle-bookmark"][data-slug="${CSS.escape(slug)}"]`).forEach(btn => {
              btn.classList.toggle('is-saved', isSaved);
              btn.setAttribute('aria-pressed', String(isSaved));
              btn.setAttribute('aria-label', isSaved ? 'Remove from saved stories' : 'Save story for later');
              btn.innerHTML = `${iBookmark(isSaved)}<span>${btn.closest('.story-card') ? (isSaved ? 'Saved' : 'Save') : (isSaved ? 'Saved for later' : 'Save for later')}</span>`;
            });
            if (currentPath() === '' || currentPath() === 'stories') render();
            break;
          }

          case 'reveal-warning': {
            warningRevealed[t.getAttribute('data-slug')] = true;
            render();
            break;
          }

          case 'filter-cat': {
            storiesFilter.category = t.getAttribute('data-cat') || 'All';
            renderStoriesResultsArea();
            break;
          }

          case 'clear-filters': {
            storiesFilter.category = 'All';
            storiesFilter.sort = 'newest';
            storiesFilter.query = '';
            const searchEl = document.getElementById('storiesSearchInput');
            if (searchEl) searchEl.value = '';
            renderStoriesResultsArea();
            break;
          }

          case 'share-back': {
            readShareFields();
            shareForm.step = Math.max(1, shareForm.step - 1);
            saveDraftToStorage();
            draftWasRestored = false;
            render();
            break;
          }

          case 'clear-draft': {
            shareForm = defaultShareForm();
            draftWasRestored = false;
            clearDraftFromStorage();
            render();
            break;
          }

          case 'open-report-modal': openReportModal(t.getAttribute('data-slug')); break;

          case 'admin-preview': {
            rebuildAdminState();
            const item = adminState.pending.find(p => p.id === t.getAttribute('data-id'));
            if (item) openAdminPreviewModal(item);
            break;
          }

          case 'admin-decide': {
            rebuildAdminState();
            const id = t.getAttribute('data-id');
            const decision = t.getAttribute('data-decision');
            const item = adminState.pending.find(p => p.id === id);
            if (item) openAdminDecideModal(item, decision);
            break;
          }

          case 'report-resolve': {
            const rid = t.getAttribute('data-id');
            const reps = getReports().map(r => r.id === rid ? Object.assign({}, r, { status: 'resolved', resolvedAt: new Date().toLocaleString() }) : r);
            saveReports(reps);
            if (currentPath() === 'admin') render();
            break;
          }

          case 'insert-prompt': {
            const fieldId = t.getAttribute('data-field');
            const promptText = t.getAttribute('data-prompt');
            const field = document.getElementById(fieldId);
            if (field && promptText) {
              const sep = field.value.trim() ? (field.value.endsWith(' ') ? '' : ' ') : '';
              field.value = field.value + sep + promptText + ' ';
              field.focus();
              readShareFields();
              scheduleAutosave();
              updateCounters();
            }
            break;
          }

          case 'copy-submission': {
            const story = lsGet('hfa_last_submitted', null);
            if (!story) break;
            const text = [
              'Story title: ' + story.title, 'Category: ' + story.category, 'Author: ' + story.author,
              '', 'What happened:', story.whatHappened, '', 'What helped:', story.whatHelped,
              '', 'What changed:', story.whatChanged || '—', '', 'What I want you to know:', story.whatIWantYouToKnow
            ].join('\n');
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard.')).catch(() => window.prompt('Copy this:', text));
            } else {
              window.prompt('Copy this:', text);
            }
            break;
          }
        }
      });

      /* Submit */
      document.addEventListener('submit', function (e) {
        const form = e.target;

        // Share form
        if (form.id === 'shareForm') {
          e.preventDefault();
          clearShareError();
          readShareFields();
          const err = shareFormValidate();
          if (err) { showShareError(err); return; }
          if (shareForm.step < 4) {
            shareForm.step += 1;
            draftWasRestored = false;
            saveDraftToStorage();
            render();
            return;
          }
          // Submit
          const author = shareForm.nameOption === 'name' ? shareForm.authorName.trim()
            : shareForm.nameOption === 'display' ? shareForm.displayName.trim() : 'Anonymous';
          const storyId = makeId('story');
          const baseSlug = slugify(shareForm.title);
          const charCount = [shareForm.whatHappened, shareForm.whatHelped, shareForm.whatChanged, shareForm.whatLearned, shareForm.whatIWantYouToKnow].join('').length;
          const newStory = {
            id: storyId, source: 'user',
            slug: baseSlug + '-' + storyId.slice(-6),
            title: shareForm.title.trim(), category: shareForm.category,
            author, nameOption: shareForm.nameOption, date: localDate(),
            readTime: Math.max(2, Math.ceil(charCount / 900)),
            appreciation: 0, contentWarning: shareForm.contentWarning.trim() || null,
            excerpt: shareForm.whatHappened.trim().slice(0, 160) + (shareForm.whatHappened.trim().length > 160 ? '…' : ''),
            whatHappened: shareForm.whatHappened.trim(), whatItFeltLike: null,
            whatHelped: shareForm.whatHelped.trim(), whatChanged: shareForm.whatChanged.trim(),
            whatLearned: shareForm.whatLearned.trim(), whatIWantYouToKnow: shareForm.whatIWantYouToKnow.trim()
          };
          const pending = getUserPending();
          pending.push(newStory);
          if (!saveUserPending(pending)) {
            showShareError({ msg: 'We could not save your submission in this browser. Please try again.', fieldId: null });
            return;
          }
          lsSet('hfa_last_submitted', newStory);
          ssSet('hfa_submitted', '1');
          shareForm = defaultShareForm();
          draftWasRestored = false;
          clearDraftFromStorage();
          location.hash = '#/share/thank-you';
          render();
          return;
        }

        if (form.id === 'commentForm') {
          e.preventDefault();
          const text = v('commentText').trim();
          const error = document.getElementById('commentError');
          if (text.length < 3) {
            if (error) error.textContent = 'Write a little more before sharing.';
            return;
          }
          const slug = form.getAttribute('data-slug');
          const comment = {
            author: v('commentName').trim() || 'Anonymous',
            text,
            date: localDate()
          };
          if (!saveStoryComment(slug, comment)) {
            if (error) error.textContent = 'We could not save this reflection in the browser. Please try again.';
            return;
          }
          render();
          return;
        }

        // Nav search
        if (form.id === 'navSearchForm') {
          e.preventDefault();
          const inp = form.querySelector('input');
          storiesFilter.query = (inp ? inp.value : '').trim().toLowerCase();
          location.hash = '#/stories';
          render();
          return;
        }

        // Mobile search
        if (form.id === 'mobileSearchForm') {
          e.preventDefault();
          const inp = form.querySelector('input');
          storiesFilter.query = (inp ? inp.value : '').trim().toLowerCase();
          closeMobilePanel(false);
          location.hash = '#/stories';
          render();
          return;
        }

        // Profile form
        if (form.id === 'profileForm') {
          e.preventDefault();
          profile = { displayName: v('pDisplayName').trim(), email: v('pEmail').trim() };
          saveProfile(profile);
          closeModal();
          return;
        }

        // Report form
        if (form.id === 'reportForm') {
          e.preventDefault();
          const slug = form.getAttribute('data-slug');
          const reason = (form.querySelector('input[name="reason"]:checked') || {}).value || 'Other';
          const details = (document.getElementById('reportDetails') || {}).value || '';
          const report = { id: makeId('report'), slug, reason, details, status: 'open', createdAt: new Date().toLocaleString() };
          const reps = getReports();
          reps.push(report);
          if (!saveReports(reps)) {
            openModal(`<h2>Report not saved</h2><p>We could not save this report in the browser. Please try again.</p><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Close</button></div>`);
            return;
          }
          openReportThanks(report);
          return;
        }

        // Contact form
        if (form.id === 'contactForm') {
          e.preventDefault();
          const contact = {
            id: makeId('contact'), name: v('cName').trim(), email: v('cEmail').trim(),
            message: v('cMessage').trim(), createdAt: new Date().toLocaleString()
          };
          if (!contact.email || !contact.message) return;
          const contacts = getContacts();
          contacts.push(contact);
          if (!saveContacts(contacts)) return;
          lsSet('hfa_last_contact', contact);
          ssSet('hfa_contacted', '1');
          location.hash = '#/contact/sent';
          render();
          return;
        }

        // Admin decision form
        if (form.id === 'adminDecisionForm') {
          e.preventDefault();
          const id = form.getAttribute('data-id');
          const decision = form.getAttribute('data-decision');
          const note = (document.getElementById('adminNote') || {}).value || '';
          if (decision !== 'approve' && note.trim().length < 10) {
            const errEl = document.getElementById('adminNoteError');
            const noteEl = document.getElementById('adminNote');
            if (errEl) errEl.style.display = 'block';
            if (noteEl) { noteEl.setAttribute('aria-invalid', 'true'); noteEl.focus(); }
            return;
          }
          const ok = performAdminDecision(id, decision, note.trim());
          if (ok) {
            closeModal();
            if (currentPath() === 'admin') render();
          }
          return;
        }
      });

      /* Input */
      document.addEventListener('input', function (e) {
        // Stories search
        if (e.target.id === 'storiesSearchInput') {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            storiesFilter.query = e.target.value.trim().toLowerCase();
            renderStoriesResultsArea();
          }, SEARCH_DELAY);
          return;
        }

        // Share form fields
        if (e.target.closest('#shareForm')) {
          readShareFields();
          draftWasRestored = false;
          e.target.removeAttribute('aria-invalid');
          const fw = e.target.closest('.field');
          if (fw) fw.classList.remove('has-error');
          clearShareError();
          updateCounters();
          scheduleAutosave();
        }

        // Admin note validation reset
        if (e.target.id === 'adminNote') {
          const errEl = document.getElementById('adminNoteError');
          if (errEl && e.target.value.trim().length >= 10) errEl.style.display = 'none';
        }
      });

      /* Change */
      document.addEventListener('change', function (e) {
        if (e.target.id === 'fCategory' && e.target.closest('#shareForm')) {
          readShareFields();
          draftWasRestored = false;
          clearShareError();
          scheduleAutosave();
          return;
        }

        if (e.target.id === 'categorySelect') {
          storiesFilter.category = e.target.value;
          renderStoriesResultsArea();
          return;
        }

        // Sort select
        if (e.target.id === 'sortSelect') {
          storiesFilter.sort = e.target.value;
          renderStoriesResultsArea();
          return;
        }

        // Radio card name option (in-place update, no full re-render)
        if (e.target.name === 'nameOption' && e.target.closest('#shareForm')) {
          shareForm.nameOption = e.target.value;
          document.querySelectorAll('.radio-card').forEach(card => {
            const inp = card.querySelector('input[name="nameOption"]');
            card.classList.toggle('is-selected', inp && inp.checked);
          });
          const container = document.getElementById('identityFieldContainer');
          if (container) container.innerHTML = identityFieldHtml();
          saveDraftToStorage();
          return;
        }

        // Consent checkbox
        if (e.target.id === 'fConsent') {
          shareForm.consent = e.target.checked;
          const fw = e.target.closest('.field,.consent-row');
          if (fw) fw.classList.remove('has-error');
          clearShareError();
          saveDraftToStorage();
          return;
        }
      });

      /* Keydown */
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          const root = document.getElementById('modalRoot');
          if (root && root.classList.contains('is-open')) { closeModal(); return; }
          const panel = document.getElementById('mobilePanel');
          if (panel && panel.classList.contains('is-open')) { closeMobilePanel(true); return; }
          const ns = document.querySelector('.nav-search.is-open');
          if (ns) ns.classList.remove('is-open');
          return;
        }
        if (e.key === 'Tab') {
          const root = document.getElementById('modalRoot');
          if (root && root.classList.contains('is-open')) { modalFocusTrap(e); return; }
          const panel = document.getElementById('mobilePanel');
          if (panel && panel.classList.contains('is-open')) { mobilePanelFocusTrap(e); return; }
        }
      });

      /* Scroll — reading progress */
      document.addEventListener('scroll', function () {
        if (readingProgressActive) updateReadingProgress();
      }, { passive: true });

      /* Hash change */
      window.addEventListener('hashchange', render);

      /* ============================================================
         BOOT
         ============================================================ */
      function boot() {
        applyTheme();
        syncPublishedToStories();
        if (!location.hash || location.hash === '#') location.hash = '#/';
        render();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }

    })();
  </script>
</body>

</html>

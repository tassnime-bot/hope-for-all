<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hope for All — Every story has a way forward.</title>
  <meta name="description"
    content="A place to tell what happened, what helped, and what you want someone else to know. Every story has a way forward.">
  <!-- Fonts use local fallbacks when the prototype is opened offline. -->
  <style>
    /* ============================================================
   DESIGN TOKENS
   ============================================================ */
    :root {
      --ivory: #FAF5EC;
      --paper: #FFFCF7;
      --paper-alt: #F3ECDF;
      --surface-soft: var(--paper-alt);
      --plum: #3A2B3D;
      --ink: #3A322E;
      --ink-soft: #786E67;
      --line: rgba(58, 43, 61, .13);
      --line-strong: rgba(58, 43, 61, .24);
      --shadow-rgb: 58, 43, 61;

      --peach: #DE9F6E;
      --peach-bg: #F6E1CC;
      --peach-text: #8A4E20;
      --lavender: #A992C4;
      --lavender-bg: #E9E0F3;
      --lavender-text: #5A4380;
      --sky: #84AFC7;
      --sky-bg: #DCEAF1;
      --sky-text: #2C5A70;
      --rose: #C68B87;
      --rose-bg: #F2DCDA;
      --rose-text: #894340;
      --sage: #89A876;
      --sage-bg: #E0E9D5;
      --sage-text: #41601F;
      --gold: #CE9B3B;
      --gold-bg: #F3E1B4;
      --gold-text: #7C5A12;

      --r-card: 24px 24px 24px 8px;
      --r-sm: 12px;
      --r-pill: 999px;
      --maxw: 1220px;
      --nav-h: 66px;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --ivory: #231A25;
        --paper: #2C222E;
        --paper-alt: #1C151E;
        --plum: #F2E7E9;
        --ink: #E7DDD9;
        --ink-soft: #B4A8A3;
        --line: rgba(255, 255, 255, .11);
        --line-strong: rgba(255, 255, 255, .2);
        --shadow-rgb: 0, 0, 0;
        --peach-bg: #4A371F;
        --peach-text: #EEC495;
        --lavender-bg: #392E4E;
        --lavender-text: #D6C4EC;
        --sky-bg: #233F49;
        --sky-text: #B4D8E6;
        --rose-bg: #432C2B;
        --rose-text: #E8BAB6;
        --sage-bg: #31401F;
        --sage-text: #BFD6A9;
        --gold-bg: #453210;
        --gold-text: #EACB80;
      }
    }

    [data-theme="dark"] {
      --ivory: #231A25;
      --paper: #2C222E;
      --paper-alt: #1C151E;
      --plum: #F2E7E9;
      --ink: #E7DDD9;
      --ink-soft: #B4A8A3;
      --line: rgba(255, 255, 255, .11);
      --line-strong: rgba(255, 255, 255, .2);
      --shadow-rgb: 0, 0, 0;
      --peach-bg: #4A371F;
      --peach-text: #EEC495;
      --lavender-bg: #392E4E;
      --lavender-text: #D6C4EC;
      --sky-bg: #233F49;
      --sky-text: #B4D8E6;
      --rose-bg: #432C2B;
      --rose-text: #E8BAB6;
      --sage-bg: #31401F;
      --sage-text: #BFD6A9;
      --gold-bg: #453210;
      --gold-text: #EACB80;
    }

    /* ============================================================
   RESET
   ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul,
    ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin: 0;
    }

    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
    }

    /* ============================================================
   BASE
   ============================================================ */
    body {
      background:
        radial-gradient(circle at 8% 10%, color-mix(in srgb, var(--peach-bg) 55%, transparent), transparent 27rem),
        radial-gradient(circle at 92% 4%, color-mix(in srgb, var(--lavender-bg) 55%, transparent), transparent 25rem),
        var(--ivory);
      color: var(--ink);
      font-family: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background .3s ease, color .3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .45;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(58, 43, 61, .035) 0 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(58, 43, 61, .025) 0 1px, transparent 1px);
      background-size: 24px 24px, 31px 31px;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-optical-sizing: auto;
      color: var(--plum);
      font-weight: 500;
      letter-spacing: -.01em;
    }

    .container {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px;
    }

    main {
      display: block;
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: -60px;
      background: var(--plum);
      color: var(--paper);
      padding: 10px 18px;
      border-radius: var(--r-sm);
      z-index: 200;
      transition: top .2s ease;
    }

    .skip-link:focus {
      top: 12px;
    }

    :focus-visible {
      outline: 2.5px solid var(--gold);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    ::selection {
      background: var(--gold-bg);
      color: var(--gold-text);
    }

    /* ============================================================
   READING PROGRESS BAR
   ============================================================ */
    #readingProgress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--peach), var(--lavender));
      z-index: 200;
      pointer-events: none;
      transition: width .08s linear, opacity .3s ease;
      opacity: 0;
    }

    #readingProgress.is-visible {
      opacity: 1;
    }

    /* ============================================================
   BUTTONS
   ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 13px;
      font-weight: 600;
      font-size: .96rem;
      border: 1.5px solid transparent;
      min-height: 46px;
      letter-spacing: -.01em;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--plum);
      color: var(--paper);
      box-shadow: 0 12px 24px -18px rgba(var(--shadow-rgb), .8);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px -20px rgba(var(--shadow-rgb), .7);
    }

    .btn-secondary {
      background: color-mix(in srgb, var(--paper) 68%, transparent);
      color: var(--plum);
      border-color: var(--line-strong);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      border-color: var(--plum);
    }

    .btn-ghost {
      background: transparent;
      color: var(--plum);
      padding: 10px 14px;
      font-weight: 600;
      border: none;
    }

    .btn-ghost:hover {
      background: var(--paper-alt);
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--rose-text);
      border: 1.5px solid var(--rose-bg);
    }

    .btn-danger-ghost:hover {
      background: var(--rose-bg);
    }

    .btn-sm {
      padding: 9px 16px;
      font-size: .87rem;
      border-radius: 10px;
      min-height: 36px;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-block {
      width: 100%;
    }

    /* ============================================================
   HEADER / NAV
   ============================================================ */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 80;
      background: color-mix(in srgb, var(--ivory) 78%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid color-mix(in srgb, var(--plum) 10%, transparent);
      box-shadow: 0 10px 34px -28px rgba(var(--shadow-rgb), .55);
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--plum);
      flex-shrink: 0;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      filter: drop-shadow(0 5px 8px rgba(var(--shadow-rgb), .14));
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      border-radius: 16px;
      border: 1px solid color-mix(in srgb, var(--plum) 9%, transparent);
      background: color-mix(in srgb, var(--paper) 72%, transparent);
      box-shadow: 0 8px 26px -24px rgba(var(--shadow-rgb), .6);
    }

    .nav-link {
      padding: 8px 13px;
      border-radius: 11px;
      font-weight: 600;
      font-size: .94rem;
      color: var(--ink-soft);
      transition: color .18s ease, background .18s ease;
    }

    .nav-link:hover {
      color: var(--plum);
      background: var(--paper-alt);
    }

    .nav-link.is-active {
      background: var(--plum);
      color: var(--paper);
      box-shadow: 0 7px 16px -12px rgba(var(--shadow-rgb), .7);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: color-mix(in srgb, var(--paper) 72%, transparent);
      border: 1px solid color-mix(in srgb, var(--plum) 10%, transparent);
      box-shadow: 0 5px 18px -16px rgba(var(--shadow-rgb), .5);
      transition: background .18s ease, transform .18s ease, border-color .18s ease;
    }

    .icon-btn:hover {
      background: var(--paper);
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .nav-search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .nav-search input {
      width: 0;
      opacity: 0;
      padding: 9px 0;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--paper-alt);
      transition: width .25s ease, opacity .2s ease, padding .25s ease;
    }

    .nav-search.is-open input {
      width: 210px;
      opacity: 1;
      padding: 9px 14px;
      border-color: var(--line);
      margin-right: 6px;
    }

    .menu-toggle {
      display: none;
    }

    /* Mobile panel */
    .mobile-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--ivory);
      padding: 20px 24px 40px;
      overflow-y: auto;
    }

    .mobile-panel.is-open {
      display: block;
    }

    body.panel-open {
      overflow: hidden;
    }

    .mobile-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .mobile-panel a.nav-link {
      display: block;
      font-size: 1.15rem;
      padding: 14px 6px;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
    }

    .mobile-search {
      margin: 20px 0 28px;
      display: flex;
      gap: 8px;
    }

    .mobile-search input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: var(--paper);
    }

    @media (max-width:900px) {

      .nav-links,
      .nav-search {
        display: none;
      }

      .menu-toggle {
        display: inline-flex;
      }
    }

    /* ============================================================
   HERO
   ============================================================ */
    .hero {
      position: relative;
      padding: 80px 0 96px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      right: -15rem;
      top: -14rem;
      width: min(54vw, 700px);
      height: min(54vw, 700px);
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--gold-bg) 72%, transparent), transparent 68%);
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr .88fr;
      align-items: center;
      gap: 70px;
    }

    .hero-eyebrow-note {
      color: var(--ink-soft);
      font-weight: 600;
      font-size: .92rem;
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 9px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--plum) 10%, transparent);
      background: color-mix(in srgb, var(--paper) 74%, transparent);
      box-shadow: 0 8px 24px -20px rgba(var(--shadow-rgb), .55);
    }

    .hero h1 {
      font-size: clamp(3.2rem, 5vw + .4rem, 5.5rem);
      line-height: .98;
      letter-spacing: -.045em;
      margin-bottom: 28px;
      max-width: 10ch;
    }

    .hero h1::after {
      content: "";
      display: block;
      width: 64px;
      height: 5px;
      margin-top: 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--gold), var(--peach), var(--lavender));
    }

    .hero-sub {
      font-size: 1.16rem;
      color: var(--ink-soft);
      max-width: 52ch;
      margin-bottom: 34px;
      line-height: 1.72;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .hero-actions .btn {
      min-width: 154px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 10px;
    }

    .hero-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--plum) 10%, transparent);
      background: color-mix(in srgb, var(--paper) 76%, transparent);
      color: var(--ink-soft);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .hero-meta-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--peach));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold-bg) 72%, transparent);
    }

    .hero-micro {
      color: var(--ink-soft);
      font-size: .94rem;
      font-style: italic;
      font-family: 'Fraunces', serif;
      opacity: .88;
    }

    .hero-illustration {
      position: relative;
      padding: 22px;
      border-radius: 38px 38px 38px 10px;
      border: 1px solid color-mix(in srgb, var(--plum) 9%, transparent);
      background: linear-gradient(145deg, color-mix(in srgb, var(--paper) 94%, transparent), color-mix(in srgb, var(--paper-alt) 72%, transparent));
      box-shadow: 0 34px 72px -44px rgba(var(--shadow-rgb), .58);
    }

    .hero-illustration::before {
      content: "";
      position: absolute;
      inset: 12px;
      pointer-events: none;
      border: 1px dashed color-mix(in srgb, var(--plum) 10%, transparent);
      border-radius: 31px 31px 31px 6px;
    }

    .hero-illustration svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    @media (max-width:900px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 34px;
      }

      .hero-illustration {
        order: -1;
        max-width: 420px;
        margin: 0 auto;
      }

      .hero h1 {
        max-width: 12ch;
      }

      .hero {
        padding: 54px 0 64px;
      }
    }

    @media (max-width:640px) {
      .hero {
        padding: 36px 0 48px;
      }

      .hero h1 {
        font-size: clamp(2.8rem, 13vw, 3.9rem);
      }

      .hero h1::after {
        width: 54px;
        height: 4px;
        margin-top: 18px;
      }

      .hero-sub {
        font-size: 1.04rem;
      }

      .hero-actions .btn {
        width: 100%;
      }

      .hero-illustration {
        padding: 14px;
        border-radius: 28px 28px 28px 8px;
      }

      .hero-illustration::before {
        inset: 8px;
        border-radius: 23px;
      }
    }

    /* hero illustration animation */
    .reveal-sun {
      opacity: 0;
      transform: translateY(14px) scale(.96);
      transform-origin: center;
    }

    .reveal-ray {
      opacity: 0;
    }

    .motion-ready .reveal-sun {
      animation: sunRise 1.1s cubic-bezier(.22, .9, .35, 1) forwards;
    }

    .motion-ready .reveal-ray {
      animation: rayFade 1s ease .5s forwards;
    }

    @keyframes sunRise {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes rayFade {
      to {
        opacity: 1;
      }
    }

    /* ============================================================
   SECTIONS / LAYOUT
   ============================================================ */
    section.block {
      padding: 88px 0;
    }

    section.block.tight {
      padding: 62px 0;
    }

    .section-head {
      max-width: 680px;
      margin-bottom: 42px;
    }

    .section-head h2 {
      font-size: clamp(2rem, 2.6vw + .8rem, 3rem);
      line-height: 1.08;
      letter-spacing: -.035em;
      margin-bottom: 14px;
    }

    .section-head p {
      color: var(--ink-soft);
      font-size: 1.04rem;
      line-height: 1.6;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fraunces', serif;
      color: var(--gold-text);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .02em;
      font-style: normal;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-tag::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--gold);
    }

    .alt-surface {
      position: relative;
      border-top: 1px solid color-mix(in srgb, var(--plum) 5%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--plum) 5%, transparent);
      background:
        radial-gradient(circle at 95% 15%, color-mix(in srgb, var(--lavender-bg) 50%, transparent), transparent 18rem),
        var(--paper-alt);
    }

    @media (max-width:640px) {
      section.block {
        padding: 60px 0;
      }
    }

    /* ============================================================
   PILLS / BADGES
   ============================================================ */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: var(--r-pill);
      font-size: .83rem;
      font-weight: 600;
    }

    .pill-btn {
      border: 1.5px solid var(--line-strong);
      background: transparent;
      color: var(--ink-soft);
      padding: 8px 13px;
      transition: all .18s ease;
    }

    .pill-btn:hover {
      border-color: var(--plum);
      color: var(--plum);
    }

    .pill-btn.is-active {
      background: var(--plum);
      color: var(--paper);
      border-color: var(--plum);
    }

    .cat-peach {
      background: var(--peach-bg);
      color: var(--peach-text);
    }

    .cat-lavender {
      background: var(--lavender-bg);
      color: var(--lavender-text);
    }

    .cat-sky {
      background: var(--sky-bg);
      color: var(--sky-text);
    }

    .cat-rose {
      background: var(--rose-bg);
      color: var(--rose-text);
    }

    .cat-sage {
      background: var(--sage-bg);
      color: var(--sage-text);
    }

    .cat-gold {
      background: var(--gold-bg);
      color: var(--gold-text);
    }

    .preview-tag {
      background: color-mix(in srgb, var(--paper) 70%, transparent);
      border: 1px dashed var(--line-strong);
      color: var(--ink-soft);
      font-size: .72rem;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-weight: 600;
      box-shadow: 0 5px 12px -12px rgba(var(--shadow-rgb), .6);
    }

    .warn-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--gold-bg);
      color: var(--gold-text);
      border: none;
      font-size: .72rem;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-weight: 600;
    }

    .warn-tag svg {
      display: inline-block;
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
    }

    /* ============================================================
   STORY GRID / CARDS
   ============================================================ */
    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .featured-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    @media (max-width:1050px) {
      .featured-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width:620px) {
      .featured-row {
        grid-template-columns: 1fr;
      }
    }

    .story-card {
      position: relative;
      overflow: hidden;
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      border: 1px solid color-mix(in srgb, var(--plum) 11%, transparent);
      border-radius: var(--r-card);
      padding: 24px 23px 21px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 18px 42px -36px rgba(var(--shadow-rgb), .7);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
      min-height: 320px;
    }

    .story-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--peach), var(--lavender), var(--sky));
      opacity: .75;
    }

    .story-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 30px 58px -40px rgba(var(--shadow-rgb), .75);
      border-color: var(--line-strong);
    }

    .story-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    .save-story-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--r-pill);
      font-size: .78rem;
      cursor: pointer;
    }

    .save-story-btn svg {
      width: 15px;
      height: 15px;
    }

    .save-story-btn:hover,
    .save-story-btn:focus-visible,
    .save-story-btn.is-saved {
      color: var(--plum);
      border-color: var(--line-strong);
      background: var(--paper-alt);
      outline: none;
    }

    .story-card h3 {
      font-size: 1.34rem;
      line-height: 1.22;
      letter-spacing: -.025em;
    }

    .story-card h3 a {
      color: inherit;
    }

    .story-card h3 a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .story-card p.excerpt {
      color: var(--ink-soft);
      font-size: .97rem;
      line-height: 1.62;
      flex-grow: 1;
    }

    .story-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: .85rem;
      color: var(--ink-soft);
      margin-top: auto;
    }

    .appreciate-mini {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .story-card .btn-secondary {
      align-self: flex-start;
      border-color: color-mix(in srgb, var(--plum) 15%, transparent);
      padding-inline: 14px;
    }

    .story-card .btn-secondary::after {
      content: "↗";
      font-size: .9rem;
      margin-left: 2px;
      transition: transform .18s ease;
    }

    .story-card .btn-secondary:hover::after {
      transform: translate(2px, -2px);
    }

    /* ============================================================
   STEPS & VALUES
   ============================================================ */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .values-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    @media (max-width:900px) {
      .steps-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .values-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width:560px) {
      .steps-grid {
        grid-template-columns: 1fr;
      }

      .values-grid {
        grid-template-columns: 1fr;
      }
    }

    .step-card {
      padding: 4px 10px 4px 0;
    }

    .step-card .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 14px 14px 14px 4px;
      background: var(--gold-bg);
      color: var(--gold-text);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Fraunces', serif;
      margin-bottom: 20px;
    }

    .step-card h3 {
      font-size: 1.18rem;
      margin-bottom: 10px;
    }

    .step-card p {
      color: var(--ink-soft);
      font-size: .95rem;
      line-height: 1.55;
    }

    .value-card {
      min-height: 172px;
      border-radius: 20px 20px 20px 6px;
      padding: 27px 24px;
      border: 1px solid color-mix(in srgb, var(--plum) 10%, transparent);
      background: color-mix(in srgb, var(--paper) 82%, transparent);
      box-shadow: 0 14px 34px -34px rgba(var(--shadow-rgb), .6);
    }

    .value-card h3 {
      font-size: 1.16rem;
      margin-bottom: 8px;
    }

    .value-card p {
      color: var(--ink-soft);
      font-size: .93rem;
      line-height: 1.55;
    }

    /* ============================================================
   CTA BAND / FINAL QUOTE
   ============================================================ */
    .cta-band {
      position: relative;
      overflow: hidden;
      background: var(--plum);
      color: var(--paper);
      border-radius: 32px 32px 32px 9px;
      padding: 68px 50px;
      text-align: center;
      box-shadow: 0 28px 70px -48px rgba(var(--shadow-rgb), .85);
    }

    .cta-band::before,
    .cta-band::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .cta-band::before {
      width: 280px;
      height: 280px;
      right: -85px;
      top: -95px;
      background: radial-gradient(circle, color-mix(in srgb, var(--gold) 28%, transparent), transparent 67%);
    }

    .cta-band::after {
      width: 220px;
      height: 220px;
      left: -90px;
      bottom: -110px;
      background: radial-gradient(circle, color-mix(in srgb, var(--lavender) 24%, transparent), transparent 67%);
    }

    .cta-band>* {
      position: relative;
      z-index: 1;
    }

    .cta-band h2 {
      color: var(--paper);
      max-width: 19ch;
      margin-inline: auto;
      font-size: clamp(1.6rem, 2.6vw + 1rem, 2.4rem);
      margin-bottom: 16px;
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .cta-band p {
      color: rgba(255, 255, 255, .72);
      max-width: 58ch;
      margin: 0 auto 28px;
      font-size: 1.05rem;
    }

    .cta-band .btn-primary {
      background: var(--paper);
      color: var(--plum);
      box-shadow: 0 15px 28px -18px rgba(0, 0, 0, .35);
    }

    .final-quote {
      text-align: center;
      padding: 70px 0 10px;
    }

    .final-quote h2 {
      font-size: clamp(1.6rem, 2.8vw + 1rem, 2.5rem);
      max-width: 16ch;
      margin: 0 auto 20px;
      line-height: 1.28;
      letter-spacing: -.035em;
    }

    .final-quote .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
    }

    .final-quote .tagline {
      color: var(--ink-soft);
      font-style: italic;
      font-family: 'Fraunces', serif;
    }

    @media (max-width:640px) {
      .cta-band {
        padding: 48px 24px;
        border-radius: 26px 26px 26px 8px;
      }
    }

    /* ============================================================
   STORIES PAGE
   ============================================================ */
    .page-head {
      padding: 56px 0 32px;
    }

    .page-head h1 {
      font-size: clamp(2rem, 3.4vw + 1rem, 3rem);
      margin-bottom: 14px;
      letter-spacing: -.04em;
    }

    .page-head p {
      color: var(--ink-soft);
      font-size: 1.05rem;
      max-width: 60ch;
    }

    .search-hero {
      position: relative;
      margin: 28px 0 8px;
      max-width: 620px;
    }

    .search-hero input {
      width: 100%;
      height: 54px;
      padding: 0 18px 0 48px;
      border-radius: 16px;
      border: 1.5px solid color-mix(in srgb, var(--plum) 14%, transparent);
      background: var(--paper);
      font-size: 1rem;
      box-shadow: 0 14px 30px -28px rgba(var(--shadow-rgb), .8);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .search-hero input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold-bg) 65%, transparent), 0 16px 34px -28px rgba(var(--shadow-rgb), .8);
    }

    .search-hero svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: .55;
      pointer-events: none;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin: 20px 0 16px;
      padding: 12px 14px;
      border: 1px solid color-mix(in srgb, var(--plum) 9%, transparent);
      border-radius: 18px;
      background: color-mix(in srgb, var(--paper) 78%, transparent);
      box-shadow: 0 14px 34px -32px rgba(var(--shadow-rgb), .7);
    }

    .filter-bar .sort-select {
      min-width: 170px;
    }

    .filter-bar .filter-label {
      margin-right: auto;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sort-select {
      padding: 10px 14px;
      border-radius: 11px;
      min-height: 40px;
      border: 1.5px solid color-mix(in srgb, var(--plum) 14%, transparent);
      background: var(--paper);
      font-weight: 600;
      font-size: .9rem;
    }

    .results-note {
      color: var(--ink-soft);
      font-size: .92rem;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .results-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-top: 42px;
    }

    .results-heading h2 {
      font-size: 1.55rem;
    }

    .results-heading p {
      color: var(--ink-soft);
      font-size: .84rem;
    }

    .topic-section {
      margin: 12px 0 34px;
      padding: 26px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 22px 22px 22px 6px;
    }

    .topic-section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .topic-section-head h2 {
      font-size: 1.45rem;
      margin-bottom: 4px;
    }

    .topic-section-head p {
      color: var(--ink-soft);
      font-size: .9rem;
      max-width: 48ch;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .topic-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 74px;
      padding: 14px 16px;
      text-align: left;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px 14px 14px 4px;
      cursor: pointer;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .topic-card:hover,
    .topic-card:focus-visible {
      border-color: var(--plum);
      box-shadow: 0 12px 25px -22px rgba(var(--shadow-rgb), .8);
      transform: translateY(-2px);
      outline: none;
    }

    .topic-card.is-active {
      border-color: var(--gold);
      box-shadow: inset 0 0 0 1px var(--gold);
    }

    .topic-card strong {
      display: block;
      color: var(--plum);
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.04rem;
      font-weight: 500;
    }

    .topic-card small {
      display: block;
      margin-top: 3px;
      color: var(--ink-soft);
      font-size: .76rem;
      line-height: 1.35;
    }

    .topic-count {
      flex: 0 0 auto;
      color: var(--ink-soft);
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .filter-label {
      color: var(--ink-soft);
      font-size: .86rem;
      font-weight: 700;
    }

    .reading-guide {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin: 10px 0 34px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--line);
    }

    .reading-guide-item {
      padding: 18px 20px;
      background: var(--paper);
    }

    .reading-guide-item strong {
      display: block;
      margin-bottom: 4px;
      color: var(--plum);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
    }

    .reading-guide-item p {
      color: var(--ink-soft);
      font-size: .86rem;
      line-height: 1.5;
    }

    .active-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .clear-filters-btn {
      font-size: .82rem;
      font-weight: 700;
      color: var(--ink-soft);
      background: var(--paper-alt);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-pill);
      padding: 5px 12px;
      cursor: pointer;
    }

    .clear-filters-btn:hover {
      color: var(--plum);
      border-color: var(--plum);
    }

    @media (max-width:640px) {
      .filter-bar {
        padding: 12px;
      }

      .filter-bar>* {
        width: 100%;
      }

      .sort-select {
        width: 100%;
      }

      .topic-section {
        padding: 18px;
      }

      .topic-section-head {
        display: block;
      }

      .topic-section-head h2 {
        margin-bottom: 6px;
      }

      .topic-grid {
        grid-template-columns: 1fr;
      }

      .reading-guide {
        grid-template-columns: 1fr;
      }

      .page-head {
        padding-top: 38px;
      }
    }

    /* ============================================================
   EMPTY / LOADING STATES
   ============================================================ */
    .empty-state {
      text-align: center;
      padding: 70px 20px;
      border: 1.5px dashed var(--line-strong);
      border-radius: 24px;
    }

    .empty-state svg {
      margin: 0 auto 20px;
      width: 52px;
      height: 52px;
      opacity: .6;
    }

    .empty-state h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    .empty-state p {
      color: var(--ink-soft);
      max-width: 40ch;
      margin: 0 auto 22px;
    }

    .skeleton-card {
      height: 200px;
      border-radius: var(--r-card);
      background: linear-gradient(100deg, var(--paper) 30%, var(--paper-alt) 50%, var(--paper) 70%);
      background-size: 200% 100%;
    }

    .motion-ready .skeleton-card {
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    /* ============================================================
   STORY DETAIL
   ============================================================ */
    .story-detail-head {
      padding: 50px 0 18px;
      max-width: 720px;
      margin: 0 auto;
    }

    .story-detail-head .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      color: var(--ink-soft);
      font-size: .92rem;
    }

    .story-detail-head h1 {
      font-size: clamp(2.3rem, 3.9vw + .5rem, 4rem);
      line-height: 1.12;
      letter-spacing: -.045em;
      margin-bottom: 16px;
    }

    .story-body {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 0 52px;
    }

    .story-body h2 {
      font-size: 1.42rem;
      margin: 44px 0 14px;
      letter-spacing: -.02em;
    }

    .story-body p {
      font-size: 1.16rem;
      line-height: 1.85;
      color: var(--ink);
      margin-bottom: 22px;
    }

    .content-warning-bar {
      max-width: 680px;
      margin: 30px auto 60px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 34px 30px;
      text-align: center;
      box-shadow: 0 22px 50px -40px rgba(var(--shadow-rgb), .7);
    }

    .content-warning-bar h2 {
      font-size: 1.25rem;
      margin-bottom: 10px;
    }

    .content-warning-bar p {
      color: var(--ink-soft);
      margin-bottom: 22px;
    }

    .quote-card {
      margin: 34px 0;
      padding: 32px 30px;
      background: var(--gold-bg);
      border-radius: 20px 20px 20px 4px;
      border: 1px solid color-mix(in srgb, var(--gold-text) 12%, transparent);
      box-shadow: 0 20px 42px -38px rgba(var(--shadow-rgb), .5);
    }

    .quote-card p {
      font-family: 'Fraunces', serif;
      font-size: 1.35rem;
      line-height: 1.5;
      color: var(--gold-text);
      font-weight: 500;
    }

    .quote-label {
      display: block;
      margin-top: 12px;
      color: var(--gold-text);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .source-note {
      margin: 26px 0 34px;
      padding: 16px 18px;
      background: var(--paper-alt);
      border-left: 3px solid var(--sage);
      color: var(--ink-soft);
      font-size: .9rem;
    }

    .source-note a {
      color: var(--plum);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .story-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-top: 28px;
      margin-top: 18px;
      border-top: 1px solid var(--line);
    }

    .appreciate-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 22px;
      border-radius: var(--r-pill);
      border: 1.5px solid var(--line-strong);
      background: color-mix(in srgb, var(--paper) 90%, transparent);
      font-weight: 600;
      box-shadow: 0 12px 28px -24px rgba(var(--shadow-rgb), .65);
      transition: all .2s ease;
    }

    .appreciate-btn:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .appreciate-btn.is-active {
      background: var(--gold-bg);
      border-color: var(--gold);
      color: var(--gold-text);
    }

    .motion-ready .appreciate-btn.just-clicked .pulse {
      animation: pulse .5s ease;
    }

    @keyframes pulse {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(1.35)
      }

      100% {
        transform: scale(1)
      }
    }

    .report-link {
      color: var(--ink-soft);
      font-size: .9rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .reader-shelf {
      margin: 0 0 42px;
      padding: 22px;
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 20px 20px 20px 6px;
    }

    .reader-shelf-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .reader-shelf h2 {
      font-size: 1.35rem;
    }

    .reader-shelf-head p {
      color: var(--ink-soft);
      font-size: .82rem;
    }

    .reader-shelf-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .reader-shelf-card {
      display: block;
      padding: 14px 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px 12px 12px 4px;
    }

    .reader-shelf-card:hover,
    .reader-shelf-card:focus-visible {
      border-color: var(--plum);
      outline: none;
    }

    .reader-shelf-card strong {
      display: block;
      color: var(--plum);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
    }

    .reader-shelf-card small {
      display: block;
      margin-top: 4px;
      color: var(--ink-soft);
      font-size: .78rem;
    }

    @media (max-width:640px) {
      .reader-shelf-grid {
        grid-template-columns: 1fr;
      }
    }

    .comment-section {
      max-width: 680px;
      margin: -14px auto 52px;
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px 22px 22px 6px;
      box-shadow: 0 22px 46px -42px rgba(var(--shadow-rgb), .7);
    }

    .comment-section h2 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .comment-intro {
      color: var(--ink-soft);
      font-size: .94rem;
      margin-bottom: 22px;
    }

    .comment-form {
      display: grid;
      gap: 12px;
    }

    .comment-form .field textarea {
      min-height: 84px;
      resize: vertical;
    }

    .comment-form>.field {
      margin-bottom: 0;
    }

    .comment-form-row {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .comment-form-row .field {
      flex: 1 1 220px;
      margin-bottom: 0;
    }

    .comment-list {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .comment-item {
      padding: 16px 18px;
      background: var(--paper-alt);
      border-radius: 14px 14px 14px 4px;
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink-soft);
      font-size: .8rem;
      margin-bottom: 7px;
    }

    .comment-author {
      color: var(--plum);
      font-weight: 700;
    }

    .comment-item p {
      color: var(--ink);
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .comment-empty,
    .comment-note {
      color: var(--ink-soft);
      font-size: .82rem;
    }

    .comment-empty {
      margin-top: 22px;
    }

    .comment-note {
      margin-top: 4px;
    }

    .comment-error {
      color: var(--rose-text);
      font-size: .84rem;
      font-weight: 700;
    }

    .appreciate-btn svg {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
    }

    .related-wrap {
      background: var(--paper-alt);
      padding: 60px 0 70px;
    }

    .thank-you-block {
      text-align: center;
      padding: 30px 0 6px;
    }

    .thank-you-block p {
      font-size: 1.2rem;
      font-family: 'Fraunces', serif;
    }

    /* ============================================================
   FORMS
   ============================================================ */
    .form-shell {
      max-width: 700px;
      margin: 0 auto;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 28px 0 40px;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid color-mix(in srgb, var(--plum) 8%, transparent);
      background: color-mix(in srgb, var(--paper) 68%, transparent);
    }

    .progress-step {
      flex: 1;
      text-align: center;
    }

    .progress-step .dot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--paper-alt);
      border: 1.5px solid var(--line-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      font-weight: 700;
      font-size: .9rem;
      color: var(--ink-soft);
      box-shadow: 0 8px 20px -16px rgba(var(--shadow-rgb), .7);
      transition: all .2s ease;
    }

    .progress-step.is-active .dot {
      background: var(--plum);
      border-color: var(--plum);
      color: var(--paper);
    }

    .progress-step.is-done .dot {
      background: var(--sage-bg);
      border-color: var(--sage);
      color: var(--sage-text);
    }

    .progress-step .label {
      font-size: .78rem;
      color: var(--ink-soft);
      font-weight: 600;
    }

    .progress-step.is-active .label {
      color: var(--plum);
    }

    @media (max-width:560px) {
      .progress-row {
        overflow-x: auto;
      }

      .progress-step {
        min-width: 90px;
      }

      .progress-step .label {
        font-size: .7rem;
      }
    }

    .draft-status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      border-radius: 14px;
      margin-bottom: 20px;
      font-size: .87rem;
      min-height: 44px;
      box-shadow: 0 12px 28px -24px rgba(var(--shadow-rgb), .5);
    }

    .draft-status svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .draft-status .ds-text {
      flex: 1;
    }

    .draft-status button {
      text-decoration: underline;
      font-weight: 700;
      color: inherit;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .draft-status.is-saving {
      background: var(--gold-bg);
      color: var(--gold-text);
    }

    .draft-status.is-hidden {
      display: none;
    }

    .field {
      margin-bottom: 26px;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--plum);
      letter-spacing: -.01em;
    }

    .field .hint {
      font-size: .87rem;
      color: var(--ink-soft);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .field input[type=text],
    .field input[type=email],
    .field textarea,
    .field select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid color-mix(in srgb, var(--plum) 14%, transparent);
      background: var(--paper);
      font-size: 1rem;
      line-height: 1.5;
      font-family: inherit;
      box-shadow: 0 10px 22px -24px rgba(var(--shadow-rgb), .8);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .field textarea {
      resize: vertical;
      min-height: 130px;
    }

    .field input[type=text]:focus,
    .field input[type=email]:focus,
    .field textarea:focus,
    .field select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold-bg) 58%, transparent), 0 13px 25px -23px rgba(var(--shadow-rgb), .8);
    }

    .field.has-error input,
    .field.has-error textarea,
    .field.has-error select {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--rose-bg) 70%, transparent);
    }

    .field.special textarea {
      background: var(--peach-bg);
      border: 1px solid color-mix(in srgb, var(--peach-text) 13%, transparent);
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      box-shadow: 0 14px 30px -26px rgba(var(--shadow-rgb), .55);
    }

    .field-error {
      color: var(--rose-text);
      font-size: .87rem;
      margin-top: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .char-counter {
      font-size: .78rem;
      color: var(--ink-soft);
      margin-top: 6px;
      text-align: right;
    }

    .char-counter.is-near {
      color: var(--gold-text);
    }

    .char-counter.is-max {
      color: var(--rose-text);
      font-weight: 700;
    }

    .prompt-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .prompt-chip {
      font-size: .82rem;
      color: var(--ink-soft);
      background: var(--paper-alt);
      border: 1px solid transparent;
      border-radius: var(--r-pill);
      padding: 6px 12px;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .prompt-chip:hover,
    .prompt-chip:focus-visible {
      background: var(--paper);
      color: var(--plum);
      border-color: var(--line-strong);
      outline: none;
    }

    .radio-card-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      border: 1.5px solid var(--line-strong);
      border-radius: 14px;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .radio-card:hover {
      border-color: var(--plum);
    }

    .radio-card.is-selected {
      border-color: var(--plum);
      background: var(--paper-alt);
    }

    .radio-card input {
      margin-top: 3px;
    }

    .radio-card .rc-title {
      font-weight: 700;
      color: var(--plum);
      display: block;
    }

    .radio-card .rc-sub {
      font-size: .87rem;
      color: var(--ink-soft);
      margin-top: 2px;
      display: block;
    }

    .identity-field-wrap {
      margin-top: 14px;
    }

    .notice-card {
      background: var(--sky-bg);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 24px;
    }

    .notice-card p {
      color: var(--sky-text);
      font-size: .93rem;
      line-height: 1.55;
    }

    .privacy-list {
      background: var(--paper-alt);
      border-radius: 16px;
      padding: 22px 24px;
      margin: 22px 0;
    }

    .privacy-list p.lead {
      font-weight: 700;
      color: var(--plum);
      margin-bottom: 12px;
    }

    .privacy-list ul {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 18px;
    }

    @media (max-width:560px) {
      .privacy-list ul {
        grid-template-columns: 1fr;
      }
    }

    .privacy-list li {
      font-size: .92rem;
      color: var(--ink-soft);
      padding-left: 16px;
      position: relative;
    }

    .privacy-list li::before {
      content: "·";
      position: absolute;
      left: 2px;
      color: var(--ink-soft);
    }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 26px 0;
      padding: 18px;
      background: var(--paper-alt);
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--plum) 7%, transparent);
    }

    .consent-row input {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .consent-row label {
      font-size: .93rem;
      color: var(--ink);
      line-height: 1.5;
    }

    .review-block {
      background: var(--paper-alt);
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 14px;
      border: 1px solid color-mix(in srgb, var(--plum) 8%, transparent);
      box-shadow: 0 10px 26px -26px rgba(var(--shadow-rgb), .6);
    }

    .review-block h4 {
      font-family: 'Karla', sans-serif;
      font-weight: 700;
      color: var(--plum);
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 8px;
    }

    .review-block p {
      color: var(--ink);
      font-size: .97rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .form-nav {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 36px;
    }

    .form-error-bar {
      background: var(--rose-bg);
      color: var(--rose-text);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: .92rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .form-error-bar.is-visible {
      display: flex;
    }

    .demo-note {
      background: var(--gold-bg);
      color: var(--gold-text);
      border-radius: 16px;
      padding: 14px 18px;
      margin: 0 0 24px;
      font-size: .9rem;
      line-height: 1.55;
      border: 1px solid color-mix(in srgb, var(--gold) 20%, transparent);
    }

    /* confirm */
    .confirm-block {
      text-align: center;
      padding: 60px 0 40px;
    }

    .confirm-block svg {
      margin: 0 auto 22px;
      width: 64px;
      height: 64px;
    }

    .confirm-block h1 {
      font-size: clamp(1.8rem, 3vw + 1rem, 2.5rem);
      margin-bottom: 16px;
    }

    .confirm-block p {
      color: var(--ink-soft);
      max-width: 48ch;
      margin: 0 auto 12px;
      line-height: 1.6;
    }

    .confirm-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .profile-note {
      background: var(--paper-alt);
      border-radius: 14px;
      padding: 14px 16px;
      margin: 16px 0;
      color: var(--ink-soft);
      font-size: .88rem;
      line-height: 1.5;
    }

    /* ============================================================
   INFO PAGES
   ============================================================ */
    .info-page {
      max-width: 790px;
      margin: 0 auto;
      padding: 52px 0 80px;
    }

    .info-page h1 {
      font-size: clamp(2rem, 3.4vw + 1rem, 2.9rem);
      margin-bottom: 22px;
    }

    .info-page .lede {
      font-size: 1.15rem;
      color: var(--ink-soft);
      margin-bottom: 40px;
      line-height: 1.65;
    }

    .info-page h2 {
      font-size: 1.35rem;
      margin: 40px 0 14px;
    }

    .info-page p {
      font-size: 1.03rem;
      line-height: 1.75;
      color: var(--ink);
      margin-bottom: 14px;
    }

    .guideline-card {
      background: var(--paper);
      border-radius: 20px 20px 20px 7px;
      padding: 22px 24px;
      margin-bottom: 16px;
      border: 1px solid color-mix(in srgb, var(--plum) 9%, transparent);
      box-shadow: 0 12px 30px -30px rgba(var(--shadow-rgb), .55);
    }

    .guideline-card h3 {
      font-size: 1.08rem;
      margin-bottom: 6px;
    }

    .guideline-card p {
      color: var(--ink-soft);
      font-size: .95rem;
      margin: 0;
    }

    .safety-card {
      background: var(--rose-bg);
      border-radius: 20px;
      padding: 30px 28px;
      margin: 30px 0;
      box-shadow: 0 18px 36px -32px rgba(var(--shadow-rgb), .45);
    }

    .safety-card h2 {
      color: var(--rose-text);
      margin-top: 0;
    }

    .safety-card p {
      color: var(--rose-text);
    }

    /* ============================================================
   CONTACT
   ============================================================ */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width:560px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }

    .report-box {
      background: var(--paper-alt);
      border-radius: 16px;
      padding: 22px;
      margin-top: 32px;
    }

    .report-box h3 {
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .report-box p {
      color: var(--ink-soft);
      font-size: .92rem;
      margin-bottom: 14px;
    }

    /* ============================================================
   ADMIN / MODERATION
   ============================================================ */
    .admin-banner {
      background: var(--lavender-bg);
      color: var(--lavender-text);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 34px;
      font-size: .92rem;
      line-height: 1.55;
    }

    .admin-banner strong {
      display: block;
      margin-bottom: 4px;
      font-family: 'Fraunces', serif;
      font-size: 1.05rem;
    }

    .admin-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 44px;
    }

    @media (max-width:800px) {
      .admin-cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .admin-stat {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 14px 34px -32px rgba(var(--shadow-rgb), .55);
    }

    .admin-stat .num {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      color: var(--plum);
    }

    .admin-stat .lbl {
      color: var(--ink-soft);
      font-size: .88rem;
    }

    .admin-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      margin-bottom: 50px;
      box-shadow: 0 14px 34px -32px rgba(var(--shadow-rgb), .55);
    }

    table.admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    .admin-table th {
      text-align: left;
      padding: 14px 18px;
      font-size: .8rem;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
      background: var(--paper-alt);
      font-weight: 700;
    }

    .admin-table td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      font-size: .92rem;
      vertical-align: top;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-actions-cell {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-chip {
      padding: 4px 11px;
      border-radius: var(--r-pill);
      font-size: .76rem;
      font-weight: 700;
    }

    .moderator-note {
      font-size: .82rem;
      color: var(--ink-soft);
      margin-top: 4px;
      font-style: italic;
    }

    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .activity-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: .92rem;
      color: var(--ink-soft);
    }

    .activity-item .dot2 {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      margin-top: 8px;
      flex-shrink: 0;
    }

    /* ============================================================
   FOOTER
   ============================================================ */
    .site-footer {
      border-top: 1px solid var(--line);
      padding: 72px 0 32px;
      margin-top: 70px;
      background:
        radial-gradient(circle at 12% 10%, color-mix(in srgb, var(--gold-bg) 40%, transparent), transparent 16rem),
        var(--paper-alt);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 44px;
      margin-bottom: 44px;
    }

    @media (max-width:800px) {
      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width:480px) {
      .footer-grid {
        grid-template-columns: 1fr;
      }
    }

    .footer-brand p {
      color: var(--ink-soft);
      font-style: italic;
      font-family: 'Fraunces', serif;
      margin-top: 10px;
      max-width: 27ch;
      font-size: 1.02rem;
    }

    .footer-col h4 {
      font-size: .85rem;
      color: var(--plum);
      margin-bottom: 14px;
      font-family: 'Karla', sans-serif;
      font-weight: 700;
    }

    .footer-col li {
      margin-bottom: 10px;
    }

    .footer-col a {
      color: var(--ink-soft);
      font-size: .93rem;
      display: inline-block;
      transition: color .18s ease, transform .18s ease;
    }

    .footer-col a:hover {
      color: var(--plum);
      text-decoration: underline;
      transform: translateX(2px);
    }

    .footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-bottom p,
    .footer-bottom a {
      color: var(--ink-soft);
      font-size: .85rem;
    }

    .footer-bottom a:hover {
      text-decoration: underline;
    }

    @media (max-width:640px) {
      .site-footer {
        margin-top: 46px;
        padding-top: 54px;
      }
    }

    /* ============================================================
   MODAL
   ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(35, 26, 37, .46);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .modal-overlay.is-open {
      display: flex;
      overflow: auto;
    }

    .modal-box {
      background: var(--paper);
      border-radius: 22px;
      max-width: 500px;
      width: 100%;
      padding: 32px 28px;
      max-height: 88vh;
      overflow-y: auto;
      position: relative;
      border: 1px solid color-mix(in srgb, var(--plum) 10%, transparent);
      box-shadow: 0 34px 90px -42px rgba(0, 0, 0, .55);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .modal-box h2 {
      font-size: 1.3rem;
      margin-bottom: 14px;
      padding-right: 28px;
    }

    .modal-box p {
      color: var(--ink-soft);
      font-size: .95rem;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .modal-actions .btn {
      flex: 1 1 140px;
    }

    .reason-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      font-size: .94rem;
      cursor: pointer;
    }

    .reason-option:last-of-type {
      border-bottom: none;
    }

    .required-note {
      font-size: .82rem;
      color: var(--rose-text);
      font-weight: 600;
      margin-top: 4px;
    }

    /* ============================================================
   MISC
   ============================================================ */
    .divider-space {
      height: 1px;
      background: var(--line);
      margin: 0;
    }

    .theme-icon {
      width: 18px;
      height: 18px;
    }

    .hero-eyebrow-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ============================================================
   PRINT STYLES
   ============================================================ */
    @media print {

      .site-header,
      .site-footer,
      .related-wrap,
      .story-actions,
      .skip-link,
      #readingProgress,
      .hero-actions,
      .nav-cta,
      button {
        display: none !important;
      }

      body {
        background: white;
        color: #000;
        font-size: 13pt;
      }

      .story-detail-head h1 {
        font-size: 22pt;
      }

      .story-body p {
        font-size: 12pt;
        line-height: 1.7;
      }

      .quote-card {
        background: #f5f0e0;
        border: 1px solid #ccc;
        page-break-inside: avoid;
      }

      a {
        color: #000;
        text-decoration: none;
      }

      .container {
        max-width: 100%;
        padding: 0 2cm;
      }
    }

    /* ============================================================
   ANIMATIONS
   ============================================================ */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

        return (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light';
      }
      function makeId(prefix) {
        return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      }
      function slugify(s) {
        return String(s || 'story').toLowerCase().trim()
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'story';
      }
      function localDate() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      function buildMailto(subject, body) {

      /* ============================================================
         STATE
         ============================================================ */
      let appreciatedSet = loadAppreciated();

      /* Share form state */
      function defaultShareForm() {
        return {

          whatHelped: '', whatChanged: '', whatLearned: '', whatIWantYouToKnow: '',
          nameOption: 'anonymous', authorName: '', displayName: '', consent: false
        };
      }
      function loadShareFormFromDraft() {
        const d = loadDraft();
        if (!d || typeof d !== 'object') return defaultShareForm();
        const base = defaultShareForm();
        Object.keys(base).forEach(k => { if (d[k] !== undefined) base[k] = d[k]; });
        base.step = Math.min(4, Math.max(1, Number(base.step) || 1));
        return base;
      }
      let shareForm = loadShareFormFromDraft();
      const shareDraftHasContent = form => Object.keys(defaultShareForm()).some(key => {
        const value = form[key];
        return typeof value === 'boolean' ? value : String(value || '').trim().length > 0;
      });
      let draftWasRestored = shareDraftHasContent(shareForm);

      /* Admin state — rebuilt on every render of admin page */
      let adminState = { pending: [], modLog: [], reports: [], contacts: [] };

      function rebuildAdminState() {
        const log = getModerationLog();
        const decidedIds = new Set(log.filter(d => d.decision === 'approve' || d.decision === 'reject').map(d => d.id));
        const needsIds = new Set(log.filter(d => d.decision === 'needs').map(d => d.id));

        const demoPending = DEMO_PENDING.filter(item => !decidedIds.has(item.id)).map(item => {
          return needsIds.has(item.id) ? Object.assign({}, item, { moderationStatus: 'needs' }) : item;
        });

        adminState.pending = demoPending.concat(getUserPending());
        adminState.modLog = log;
        adminState.reports = getReports();
        adminState.contacts = getContacts();
      }

      /* Load published user stories into STORIES array at boot */
      function syncPublishedToStories() {

      function iHeart(active) { return `<svg class="pulse" viewBox="0 0 24 24" fill="${active ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8"><path d="M12 20.2c-.3 0-.6-.1-.8-.3C7.2 16.6 3 13 3 8.9 3 6.2 5.1 4 7.8 4c1.6 0 3.1.8 4.2 2.1C13.1 4.8 14.6 4 16.2 4 18.9 4 21 6.2 21 8.9c0 4.1-4.2 7.7-8.2 11-.2.2-.5.3-.8.3Z"/></svg>`; }
      function iUser() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4S18.8 16.4 20 20"/></svg>'; }
      function iTheme(dark) { return dark ? '<svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>' : '<svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.6 8.6 0 1 0 20.4 15.2Z"/></svg>'; }
      function iEmpty() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 18c2-8 4-8 8-8s6 0 8 8"/><circle cx="12" cy="7" r="2.4"/></svg>'; }
      function iChevLeft() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M14 6l-6 6 6 6"/></svg>'; }
      function iCheck() { return '<svg viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.3l2.6 2.6L16 9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
      function iBookmark(active) { return `<svg viewBox="0 0 24 24" fill="${active ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5Z"/></svg>`; }

      function iWarning() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'; }

      /* ============================================================
         UTILITY HELPERS
         ============================================================ */
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      }
      function nl2p(s) { return `<p>${esc(s)}</p>`; }
      function formatDate(iso) {
        const d = new Date(iso + 'T00:00:00');
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

      function findStory(slug) { return STORIES.find(s => s.slug === slug) || null; }
      function apprCount(story) { return story.appreciation + (appreciatedSet.has(story.slug) ? 1 : 0); }

        return `<span class="pill cat-${catAccent(name)}${extra ? ' ' + extra : ''}">${esc(name)}</span>`;

      /* ============================================================

      function storyCardHtml(story) {

        if (story.contentWarning) tags.push(`<span class="warn-tag">${iWarning()} Content note</span>`);
        if (story.source === 'user') tags.push('<span class="preview-tag">Community story</span>');
        else if (story.source === 'public') tags.push('<span class="preview-tag">Public-domain source</span>');
        else tags.push('<span class="preview-tag">Preview story</span>');

        return `

    <div class="story-card-top"><div>${tags.join('')}</div><button type="button" class="save-story-btn${isSaved ? ' is-saved' : ''}" data-action="toggle-bookmark" data-slug="${esc(story.slug)}" aria-pressed="${isSaved}" aria-label="${isSaved ? 'Remove from saved stories' : 'Save story for later'}">${iBookmark(isSaved)}<span>${isSaved ? 'Saved' : 'Save'}</span></button></div>

    </div>
    <a href="#/stories/${story.slug}" class="btn btn-secondary btn-sm">Read story</a>
  </article>`;

        const cards = [...saved, ...recent].map(story => `
    <a class="reader-shelf-card" href="#/stories/${esc(story.slug)}">
      <strong>${esc(story.title)}</strong>
      <small>${saved.includes(story) ? 'Saved for later' : 'Continue reading'} · ${story.readTime} min read</small>
    </a>`).join('');
        return `<section class="block" aria-labelledby="readerShelfHeading"><div class="container"><div class="reader-shelf">

        storiesFilter.sort = 'newest';
        const qi = hash.indexOf('?');
        if (qi === -1) return;
        const p = new URLSearchParams(hash.slice(qi + 1));
        storiesFilter.query = (p.get('q') || '').trim().toLowerCase();
        const cat = p.get('category') || 'All';
        storiesFilter.category = (cat === 'All' || CATEGORIES.some(c => c.name === cat)) ? cat : 'All';
        const sort = p.get('sort') || 'newest';
        storiesFilter.sort = ['newest', 'appreciated', 'shortest', 'longest'].includes(sort) ? sort : 'newest';
      }
      function writeStoriesFilterToURL() {
        const p = [];
        if (storiesFilter.query) p.push('q=' + encodeURIComponent(storiesFilter.query));
        if (storiesFilter.category !== 'All') p.push('category=' + encodeURIComponent(storiesFilter.category));
        if (storiesFilter.sort !== 'newest') p.push('sort=' + encodeURIComponent(storiesFilter.sort));
        history.replaceState(null, '', '#/stories' + (p.length ? '?' + p.join('&') : ''));

      function storiesMatchFilter(story) {
        if (storiesFilter.category !== 'All' && story.category !== storiesFilter.category) return false;
        if (storiesFilter.query) {
          const q = storiesFilter.query;
          const hay = [story.title, story.whatHappened, story.whatItFeltLike, story.whatHelped,
          story.whatChanged, story.whatLearned, story.whatIWantYouToKnow, story.category, story.author]
            .filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;

      function openModal(html, opts) {

        modalReturnFocus = document.activeElement;
        const titleId = 'modalTitle' + Date.now();
        const content = html.replace(/<h2/, `<h2 id="${titleId}"`);
        root.innerHTML = `
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
      <button type="button" class="icon-btn modal-close" data-action="close-modal" aria-label="Close dialog">${iClose()}</button>
      ${content}
    </div>`;
        root.classList.add('is-open');
        root.setAttribute('aria-hidden', 'false');
        const appEl = document.getElementById('app');
        if (appEl && 'inert' in appEl) appEl.inert = true;
        const firstFocusable = root.querySelector('button,input,textarea,select,a[href]');
        if (firstFocusable) setTimeout(() => firstFocusable.focus(), 50);
      }
      function closeModal() {
        const root = document.getElementById('modalRoot');
        root.classList.remove('is-open');
        root.setAttribute('aria-hidden', 'true');
        root.innerHTML = '';
        const appEl = document.getElementById('app');
        if (appEl && 'inert' in appEl) appEl.inert = false;
        if (modalReturnFocus && typeof modalReturnFocus.focus === 'function') {
          modalReturnFocus.focus();
        }
        modalReturnFocus = null;
      }
      function modalFocusTrap(e) {
        const root = document.getElementById('modalRoot');
        if (!root.classList.contains('is-open')) return;
        const focusables = Array.from(root.querySelectorAll('a[href],button:not([disabled]),input,textarea,select,[tabindex]:not([tabindex="-1"])'));
        if (!focusables.length) return;
        const first = focusables[0], last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }

      /* ============================================================
         ADMIN DECISION LOGIC
         ============================================================ */
      function performAdminDecision(id, decision, note) {
        rebuildAdminState();
        const idx = adminState.pending.findIndex(p => p.id === id);
        if (idx < 0) return false;
        const item = adminState.pending[idx];
        const entry = {
          id, title: item.title, decision, moderator: 'Demo moderator',
          createdAt: new Date().toLocaleString(), note: note || ''
        };
        const log = getModerationLog();
        log.push(entry);
        if (!saveModerationLog(log)) return false;

        if (decision === 'needs') {
          if (!saveUserPending(getUserPending().map(p => p.id === id ? Object.assign({}, p, { moderationStatus: 'needs', moderatorNote: note }) : p))) return false;
        } else {
          if (!saveUserPending(getUserPending().filter(p => p.id !== id))) return false;
          if (decision === 'approve') {
            const pub = getPublishedStories();
            if (!pub.some(p => p.id === item.id)) {
              pub.push(Object.assign({}, item, { moderationStatus: 'approved' }));
              if (!savePublishedStories(pub)) return false;
              syncPublishedToStories();
            }
          }
        }
        return true;
      }

      function initReadingProgress() {

        const body = document.getElementById('storyBody');
        if (!body) { bar.style.width = '0%'; bar.classList.remove('is-visible'); readingProgressActive = false; return; }
        readingProgressActive = true;
        bar.classList.add('is-visible');
        updateReadingProgress();

      function updateReadingProgress() {
        if (!readingProgressActive) return;
        const bar = document.getElementById('readingProgress');
        if (!bar) return;
        const docEl = document.documentElement;
        const scrolled = docEl.scrollTop || document.body.scrollTop;
        const max = docEl.scrollHeight - docEl.clientHeight;
        bar.style.width = max > 0 ? Math.min(100, (scrolled / max) * 100) + '%' : '100%';
      }
